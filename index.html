<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singapore MNC Risk & Strategy AI Agent</title>
<style>
  :root {
    --bg: #0e1420;
    --panel: #161d2e;
    --border: #263049;
    --text: #e7ecf5;
    --muted: #93a1bd;
    --high: #e05a5a;
    --medium: #e0a83a;
    --low: #4caf7d;
    --accent: #4f8bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header h1 { font-size: 1.6rem; margin-bottom: 4px; }
  header p { color: var(--muted); margin-top: 0; max-width: 720px; line-height: 1.5; }
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }

  #industry-list { list-style: none; margin: 0; padding: 0; }
  #industry-list li {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    font-size: 0.92rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid transparent;
  }
  #industry-list li:hover { background: #1d263b; }
  #industry-list li.active { background: #1d2c4d; border-color: var(--accent); }
  .badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .badge.High { background: rgba(224,90,90,0.18); color: var(--high); }
  .badge.Medium { background: rgba(224,168,58,0.18); color: var(--medium); }
  .badge.Low { background: rgba(76,175,125,0.18); color: var(--low); }

  .detail h2 { margin-top: 0; font-size: 1.3rem; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 18px 0; }
  .metric { background: #10182a; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .metric .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .metric .value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .top { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; color: var(--muted); }
  .bar-track { background: #0b111e; border-radius: 6px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7fb0ff); }

  .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 22px 0 10px; }
  .strategy-box { background: #10182a; border-left: 3px solid var(--accent); border-radius: 6px; padding: 12px 14px; font-size: 0.92rem; line-height: 1.5; }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 40px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🇸🇬 Singapore MNC Risk &amp; Strategy AI Agent</h1>
    <p>No-install browser demo. Select an industry to see its weighted risk score, K-Means strategic segment, Monte Carlo stress-test result, top risk drivers, and the agent's recommended strategy.</p>
  </header>

  <div class="layout">
    <div class="card">
      <div class="section-title">Industries</div>
      <ul id="industry-list"></ul>
    </div>

    <div class="card detail" id="detail"></div>
  </div>

  <footer>
    Built by Sharmi J &middot;
    <a href="https://github.com/sharmi1991/singapore-mnc-risk-strategy-ai-agent" target="_blank">GitHub Repo</a>
  </footer>
</div>

<script>

const listEl = document.getElementById('industry-list');
const detailEl = document.getElementById('detail');

function driverLabel(key) {
  const labels = {
    cost_pressure: "Cost Pressure",
    talent_labour: "Talent & Labour Risk",
    competition_growth: "Competition & Growth Risk",
    regulation_compliance: "Regulation & Compliance Risk",
    global_strategy: "Global Strategy Risk",
  };
  return labels[key] || key;
}

function render(industry) {
  document.querySelectorAll('#industry-list li').forEach(li => {
    li.classList.toggle('active', li.dataset.name === industry.industry);
  });

  detailEl.innerHTML = `
    <h2>${industry.industry}</h2>
    <div class="metrics">
      <div class="metric">
        <div class="label">Risk Score</div>
        <div class="value">${industry.risk_score} / 100</div>
      </div>
      <div class="metric">
        <div class="label">Risk Band</div>
        <div class="value"><span class="badge ${industry.risk_band}">${industry.risk_band}</span></div>
      </div>
      <div class="metric">
        <div class="label">Strategic Segment</div>
        <div class="value" style="font-size:0.95rem">${industry.strategic_segment}</div>
      </div>
      <div class="metric">
        <div class="label">Prob. High-Risk (Stress Test)</div>
        <div class="value">${(industry.prob_high_risk*100).toFixed(1)}%</div>
      </div>
    </div>

    <div class="section-title">Top Risk Drivers (Explainability)</div>
    ${[industry.top_driver_1, industry.top_driver_2, industry.top_driver_3].map((d,i) => `
      <div class="bar-row">
        <div class="top"><span>${i+1}. ${driverLabel(d)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${100 - i*25}%"></div></div>
      </div>
    `).join('')}

    <div class="section-title">Agent Recommendation</div>
    <div class="strategy-box">${industry.final_strategy}</div>
  `;
}

industries.forEach((ind, i) => {
  const li = document.createElement('li');
  li.dataset.name = ind.industry;
  li.innerHTML = `<span>${ind.industry}</span><span class="badge ${ind.risk_band}">${ind.risk_band}</span>`;
  li.addEventListener('click', () => render(ind));
  listEl.appendChild(li);
  if (i === 0) render(ind);
});
</script>
</body>
</html>
